# Windows build for gbfr_auto.
#
# WHY THIS EXISTS: PyInstaller is not a cross-compiler. It bundles the host
# platform's Python runtime, so a Windows .exe cannot be produced from Linux --
# its own docs offer only that Wine "is said to be possible". The dev branch also
# needs pywin32, which publishes no non-Windows wheels at all. Development here
# happens on Linux, so a Windows runner is the only route to a build.
#
# Produces a directory laid out exactly as the app expects at runtime:
#
#     GBFR Auto.exe
#     hook/gbfr_hook.dll
#
# The DLL must sit NEXT TO the .exe, not inside it: window_input.py resolves it
# from dirname(sys.argv[0]) when frozen, which is the .exe's own directory --
# PyInstaller's --add-data would unpack it to sys._MEIPASS instead, where nothing
# looks for it. template/ is different: it IS bundled, and main.py extracts it on
# first run.

name: build-windows

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Default to read-only. The release job raises this for itself alone.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the local uv-managed venv. Every pinned dependency has a
  # cp313-compatible win_amd64 wheel; numpy 2.5.2 rules out anything below 3.12.
  PYTHON_VERSION: "3.13"
  ARTIFACT_NAME: GBFR-Auto-windows-x64
  # Source of ViGEmClient.dll and the ViGEmBus installer bundled into the probe.
  VGAMEPAD_VERSION: "0.1.0"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ruff only. The runtime dependencies are Windows-only (pywin32) and ruff
      # needs none of them -- it parses, it does not import.
      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      - name: ruff check
        run: ruff check --output-format=github .

  test:
    name: pytest (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # pywin32 is markered out on Linux; everything else the suite needs
      # installs fine. tests/conftest.py stubs the Windows boundary.
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: pytest
        run: pytest -q

  build:
    name: build (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Builds via the repo's own hook/build.bat so CI exercises the documented
      # build path rather than a parallel one. Two guards around it:
      #
      #   - the tracked DLL is deleted first, so a stale binary cannot be mistaken
      #     for a fresh build (and this keeps working once #6 untracks it);
      #   - build.bat reports success unconditionally -- it never checks cl's exit
      #     code -- so the DLL's existence is verified explicitly afterwards.
      - name: Build hook/gbfr_hook.dll
        shell: cmd
        run: |
          if exist "hook\gbfr_hook.dll" del /f /q "hook\gbfr_hook.dll"
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          if not defined VSPATH (echo No MSVC toolchain found on the runner. & exit /b 1)
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cd hook
          call build.bat || exit /b 1
          if not exist "gbfr_hook.dll" (echo build.bat exited 0 but produced no DLL. & exit /b 1)
          dir gbfr_hook.dll

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Catches a missing dependency here, with a readable traceback, rather than
      # as a frozen .exe that dies on launch with no console (--windowed). Safe to
      # import: main.py does all its work under `if __name__ == "__main__"`.
      - name: Import smoke test
        run: python -c "import main; print('imports OK')"

      # The same suite, but here conftest's stubs do NOT engage -- the real
      # win32/pyautogui/pynput modules are present, so this exercises the code
      # against the actual platform it ships on. Worth more than the Linux run.
      - name: pytest (against real win32 modules)
        run: pytest -q

      # The README's command verbatim, plus --noconfirm for non-interactivity.
      - name: PyInstaller
        shell: cmd
        run: >
          pyinstaller --noconfirm --onefile --windowed --name "GBFR Auto"
          --uac-admin --icon "icon.ico"
          --add-data "template;template" --add-data "icon.ico;."
          main.py

      # ViGEmClient.dll for the virtual-gamepad probe, taken from vgamepad's
      # sdist (MIT, GPL-2.0 compatible). We extract the tarball rather than
      # `pip install vgamepad`, because that package's setup.py unconditionally
      # runs `msiexec /i ViGEmBusSetup.msi` at INSTALL time -- the skip flag
      # exists only on its unreleased GitHub HEAD. Installing a kernel driver on
      # a CI runner is not acceptable, and it would hang the build.
      #
      # Only the client library. The sdist also carries a ViGEmBus installer,
      # but it is 1.17.333.0 from 2021 while the official release is 1.22.0 --
      # shipping a five-year-old kernel driver is not ours to do. The probe
      # points at the official download instead.
      #
      # Not committed to the repo: same rule as #6 -- binaries are fetched at
      # build time, never versioned.
      - name: Fetch ViGEmClient.dll
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = (Invoke-RestMethod 'https://pypi.org/pypi/vgamepad/${{ env.VGAMEPAD_VERSION }}/json').urls |
                 Where-Object { $_.filename -like '*.tar.gz' } | Select-Object -First 1 -ExpandProperty url
          Invoke-WebRequest $url -OutFile vgamepad.tar.gz
          tar -xzf vgamepad.tar.gz
          New-Item -ItemType Directory -Force -Path vigem_bin | Out-Null
          $base = "vgamepad-${{ env.VGAMEPAD_VERSION }}/vgamepad/win/vigem"
          Copy-Item "$base/client/x64/ViGEmClient.dll" vigem_bin/
          Get-ChildItem vigem_bin | Format-Table Name, Length
          if (-not (Test-Path vigem_bin/ViGEmClient.dll)) { throw 'ViGEmClient.dll missing' }

      # The diagnostic probe, shipped alongside so answering the open questions
      # on a Windows machine needs no Python install there -- download, unzip,
      # double-click. --console, not --windowed: the whole point is its output.
      # No --uac-admin either; it is read-only and should not demand elevation.
      # ViGEmClient.dll rides inside it, so the gamepad check needs no setup
      # beyond the driver itself.
      # --paths . is load-bearing. The script lives in tools/, so PyInstaller adds
      # tools/ to its search path -- but vigem.py, opencv.py and window_capture.py
      # are at the repo root. The sys.path.insert the script does at runtime is
      # invisible to static analysis, so without this the modules are simply not
      # bundled and the exe dies at import with ModuleNotFoundError.
      - name: PyInstaller (probe)
        shell: cmd
        run: >
          pyinstaller --noconfirm --onefile --console --name "gbfr-probe"
          --icon "icon.ico"
          --add-data "vigem_bin;vigem_bin"
          --paths .
          tools/windows_probe.py

      # PyInstaller writes "missing module named X" into build/<name>/warn-*.txt
      # and exits 0. That file is why a probe with no vigem module built cleanly
      # and only failed on the user's machine. Read it, and fail on OUR modules
      # -- third-party optional imports warn constantly and are not our problem.
      - name: Check PyInstaller found our own modules
        shell: pwsh
        run: |
          $warn = "build/gbfr-probe/warn-gbfr-probe.txt"
          if (-not (Test-Path $warn)) { throw "no PyInstaller warning file at $warn" }
          $ours = 'vigem', 'xinput', 'procinfo', 'opencv', 'window_capture', 'applog', 'config'
          $bad = Get-Content $warn | Where-Object {
            $line = $_
            ($line -match '^missing module named ([A-Za-z_][A-Za-z0-9_]*)') -and
            ($ours -contains $Matches[1])
          }
          if ($bad) {
            Write-Host "PyInstaller could not find modules that belong to this repo:"
            $bad | ForEach-Object { Write-Host "  $_" }
            throw "probe build is missing repo modules -- check --paths"
          }
          Write-Host "All repo modules resolved."

      # Run the thing we just built. PyInstaller only WARNS about modules it
      # could not find, so a broken exe builds "successfully" and the failure
      # surfaces on the user's machine instead. There is no game and no Steam on
      # the runner, so the probe reports plenty of absences -- what matters is
      # that it starts, finishes, and writes a report.
      - name: Smoke-test the probe executable
        shell: cmd
        run: |
          cd dist
          "gbfr-probe.exe" < nul
          if errorlevel 1 (echo Probe exited non-zero. & type gbfr-probe-report.txt & exit /b 1)
          if not exist "gbfr-probe-report.txt" (echo Probe wrote no report. & exit /b 1)
          findstr /c:"ABORTED" gbfr-probe-report.txt >nul && (
            echo Probe aborted:
            type gbfr-probe-report.txt
            exit /b 1
          )
          findstr /c:"[FAIL]" gbfr-probe-report.txt >nul && (
            echo A dependency failed to import inside the packaged probe:
            type gbfr-probe-report.txt
            exit /b 1
          )
          echo Probe ran clean.
          type gbfr-probe-report.txt
          del gbfr-probe-report.txt

      - name: Stage the DLL beside the executable
        shell: cmd
        run: |
          if not exist "dist\GBFR Auto.exe" (echo PyInstaller produced no executable. & exit /b 1)
          if not exist "dist\gbfr-probe.exe" (echo PyInstaller produced no probe. & exit /b 1)
          mkdir "dist\hook"
          copy /y "hook\gbfr_hook.dll" "dist\hook\gbfr_hook.dll" || exit /b 1
          dir /s /b dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the only job that writes; build stays read-only
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist

      - name: Package
        run: cd dist && zip -r "../${{ env.ARTIFACT_NAME }}-${{ github.ref_name }}.zip" .

      # gh is preinstalled on the runner -- no third-party release action, and so
      # no extra supply-chain surface for the one step holding a write token.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >
          gh release create "${{ github.ref_name }}"
          "${{ env.ARTIFACT_NAME }}-${{ github.ref_name }}.zip"
          --title "${{ github.ref_name }}"
          --generate-notes
